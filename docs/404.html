        @keyframes walk-thigh {

            }
            25% {

                animation-timing-function: ease-in-out;
            }
            37.5% {

                animation-timing-function: ease-in-out;
            }
            50% {
                transform: rotate(15deg);
                animation-timing-function: ease-in-out;
            }
            75% {
                transform: rotate(-45deg);
                animation-timing-function: ease-in-out;
            }
            100% {
                transform: rotate(-45deg);
            }
        }

        @keyframes walk-calf {
            0% {
                transform: rotate(20deg);
                animation-timing-function: ease-in-out;
            }
            25% {
                transform: rotate(5deg);
                animation-timing-function: ease-out;
            }
            31.25% {
                transform: rotate(35deg);
                animation-timing-function: ease-in;
            }
            37.5% {
                transform: rotate(42deg);
                animation-timing-function: ease-in-out;
            }
            50% {
                transform: rotate(45deg);
                animation-timing-function: ease-in-out;
            }
            75% {
                transform: rotate(100deg);
                animation-timing-function: ease-in-out;
            }
            100% {
                transform: rotate(20deg);
            }
        }

        @keyframes walk-arm {
            0% {
                transform: rotate(15deg);
                animation-timing-function: ease-in;
            }
            25% {
                transform: rotate(5deg);
                animation-timing-function: ease-out;
            }
            50% {
                transform: rotate(-5deg);
                animation-timing-function: ease-in;
            }
            75% {
                transform: rotate(5deg);
                animation-timing-function: ease-out;
            }
            100% {
                transform: rotate(15deg);
            }
        }

        @keyframes walk-forearm {
            0% {
                transform: rotate(-10deg);
            }

            25% {
                transform: rotate(-20deg);
            }

            50% {
                transform: rotate(-35deg);
            }

            75% {
                transform: rotate(-20deg);
            }

            100% {
                transform: rotate(-10deg);
            }
        }

        @keyframes walk-bounce {
            0% {
                transform: translateY(3px) rotate(2deg);
                animation-timing-function: ease-out;
            }
            25% {
                transform: translateY(-16px) rotate(0deg);
                animation-timing-function: ease-in;
            }
            50% {
                transform: translateY(3px) rotate(-1deg);
                animation-timing-function: ease-out;
            }
            75% {
                transform: translateY(-16px) rotate(0deg);
                animation-timing-function: ease-in;
            }
            0% { transform: translateY(1px) rotate(2deg); animation-timing-function: ease-out; }
            25% { transform: translateY(-16px) rotate(0deg); animation-timing-function: ease-in; }
            50% { transform: translateY(1px) rotate(-1deg); animation-timing-function: ease-out; }
            75% { transform: translateY(-16px) rotate(0deg); animation-timing-function: ease-in; }
            100% { transform: translateY(1px) rotate(2deg); }

            25% { transform: rotate(5deg); animation-timing-function: ease-out; }
            31.25% { transform: rotate(-15deg); animation-timing-function: ease-in; }

            50% { transform: rotate(30deg); animation-timing-function: ease-in-out; }
            75% { transform: rotate(-20deg); animation-timing-function: ease-in-out; }

            100% {

        .smoke-2 {
