name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main  # Ganti dengan 'master' jika branch utama Anda masih menggunakan nama lama
  schedule:
    - cron: '0 0 * * *' # Otomatis update otomatis setiap jam 12 malam agar grafik kontribusi segar terus

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Build Script
      env:
        PORTFOLIO_GRAPHQL_TOKEN: ${{ secrets.PORTFOLIO_GRAPHQL_TOKEN }}
        GITHUB_USERNAME: "zakyislam"
      run: python build.py

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs
        branch: gh-pages